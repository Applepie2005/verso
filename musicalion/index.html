<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Musicalion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="app" class="app" aria-live="polite">
      <!-- Fondo global cinematográfico -->
      <div class="bg-layer" aria-hidden="true">
        <div class="bg-image" id="bgImage"></div>
        <div class="bg-vignette"></div>
        <div class="bg-overlay"></div>
        <div class="bg-grain"></div>
      </div>

      <!-- Pantalla 1: Intro -->
      <section class="screen screen--intro is-active" data-screen="intro" id="screenIntro">
        <div class="screen__inner">
          <p class="type-line type-line--1" id="introLine1"></p>
        </div>
      </section>

      <!-- Pantalla 2: Pregunta -->
      <section class="screen screen--question" data-screen="question" id="screenQuestion" hidden>
        <div class="screen__inner">
          <h1 class="question-title">¿Quieres ir al Musicalion conmigo?</h1>
          <div class="choice-row">
            <button type="button" class="btn btn--choice" id="btnYes" data-choice="yes">
              <span class="btn__box" aria-hidden="true"></span>
              Sí
            </button>
            <button type="button" class="btn btn--choice" id="btnNo" data-choice="no">
              <span class="btn__box" aria-hidden="true"></span>
              No
            </button>
          </div>
        </div>
      </section>

      <!-- Respuesta No -->
      <section class="screen screen--no" data-screen="no" id="screenNo" hidden>
        <div class="screen__inner">
          <p class="muted-text">Sin presiones. Este espacio es solo para ti.</p>
          <button type="button" class="btn btn--ghost" id="btnNoBack">Volver</button>
        </div>
      </section>

      <!-- Transición Sí -->
      <section class="screen screen--transition" data-screen="transition" id="screenTransition" hidden>
        <div class="screen__inner">
          <p class="type-line type-line--transition" id="transitionLine"></p>
        </div>
      </section>

      <!-- Galería: todas las fotos, una a una con fundido automático -->
      <section class="screen screen--memories" data-screen="memories" id="screenMemories" hidden>
        <div class="mem-autoplay" id="memAutoplay">
          <div class="mem-slides" id="memSlides"></div>
        </div>
      </section>

      <!-- YouTube: música de fondo (se inicia al pulsar Sí; reproductor oculto) -->
      <div class="yt-music-bg" aria-hidden="true">
        <iframe
          id="ytMusicBg"
          title="Música de fondo"
          width="320"
          height="180"
          src=""
          loading="eager"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
